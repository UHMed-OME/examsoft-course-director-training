# Optional: build the site from content/ on every push and publish to Pages.
#
# The repository already commits a built index.html, so Pages can serve the
# root directly with no workflow at all. Use this instead if you would rather
# not commit generated output -- pick ONE approach, not both.
#
# To use it: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: node build/build.mjs

      - name: Check vendor links
        run: node build/check-links.mjs
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
